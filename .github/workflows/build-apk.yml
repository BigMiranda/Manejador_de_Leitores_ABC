name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Keystore de assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::Secrets de assinatura não configurados. Veja o README (seção Assinatura)."
            exit 1
          else
            echo "::warning::Sem keystore: APK assinado com a chave de debug (só para teste)."
          fi

      - name: Versão
        id: versao
        run: |
          BASE="$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "build=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "nome=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "build=$BASE" >> "$GITHUB_OUTPUT"
            echo "nome=$BASE-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build do APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name="${{ steps.versao.outputs.build }}" \
            --build-number="${{ github.run_number }}"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "leitores-abc-${{ steps.versao.outputs.nome }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: leitores-abc-${{ steps.versao.outputs.nome }}
          path: leitores-abc-*.apk

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: leitores-abc-*.apk
          generate_release_notes: true
