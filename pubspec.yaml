name: manejador_leitores
description: "Manejador de leitores ABC"
publish_to: 'none'

version: 1.1.1+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  riverpod: ^3.4.3
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  html: ^0.15.7
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.3
  workmanager: ^0.10.10
  pdf: ^3.13.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  timezone: ^0.11.2
  screenshot: ^3.0.0
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true

  # Roboto (Apache 2.0, ver assets/fonts/LICENSE-Roboto.txt), embutida para a
  # exportação da escala sair igual no celular e no golden test.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
